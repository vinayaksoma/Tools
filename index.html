<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AgentOS">
<meta name="theme-color" content="#F5F5F2">
<meta name="format-detection" content="telephone=no">
<title>AgentOS</title>
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ic">
<style>
:root{--bg:#F5F5F2;--card:#fff;--ink:#16181A;--mut:#6B7075;--line:#E6E6E1;--ac:#0B7A75;--acs:#E1F1EF;--red:#C8402F;--amb:#B7791F;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
#main{flex:1;overflow-y:auto;padding:calc(var(--sat) + 14px) 18px 120px;-webkit-overflow-scrolling:touch}
h1{font-size:34px;letter-spacing:-.03em;margin:6px 0 2px;font-weight:800}
h2{font-size:13px;color:var(--mut);font-weight:600;margin:22px 0 8px 4px;letter-spacing:.01em}
.sub{color:var(--mut);margin:0 0 10px}
.card{background:var(--card);border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);overflow:hidden}
.card.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;min-height:56px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.grow{flex:1;min-width:0}.grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
small{color:var(--mut);font-size:13px}.red{color:var(--red)}.amb{color:var(--amb)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid #C5C7C2;background:none;flex:none;padding:0}
.chk.on{background:var(--ac);border-color:var(--ac);box-shadow:inset 0 0 0 5px #fff}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--acs);color:var(--ac);font-weight:600;flex:none;white-space:nowrap}
.tag.appt{background:#EEE9FB;color:#5B3FB5}.tag.task{background:#EFEFEA;color:#555}.tag.red{background:#FBE9E6;color:var(--red)}
.av{width:42px;height:42px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:700;flex:none}
.btn{appearance:none;border:0;background:var(--ac);color:#fff;font:600 16px inherit;font-family:inherit;min-height:50px;border-radius:14px;padding:0 20px;width:100%}
.btn.sec{background:var(--acs);color:var(--ac)}.btn.ghost{background:#fff;color:var(--red);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn:active,.row:active{opacity:.7}.btn[disabled]{opacity:.5}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pill{appearance:none;border:0;background:#fff;color:var(--ink);font:500 14px inherit;font-family:inherit;padding:0 14px;min-height:38px;border-radius:99px;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pill.on{background:var(--ink);color:#fff}
.seg{display:flex;background:#E9E9E4;border-radius:12px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;min-height:36px;border-radius:10px;font:600 13px inherit;font-family:inherit;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
input,select,textarea{width:100%;font:16px inherit;font-family:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-top:6px;appearance:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 0}
.err{color:var(--red);font-size:13px;margin-top:4px;min-height:0}
#tabs{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:flex;background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding:6px 4px calc(var(--sab) + 4px);z-index:20}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px inherit;font-family:inherit;color:#8A8F94;min-height:50px}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tab.on{color:var(--ac)}
#fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(var(--sab) + 74px);width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;box-shadow:0 8px 22px rgba(11,122,117,.4);z-index:15}
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.25s;z-index:30}
#sheet{position:fixed;inset:0;max-width:560px;margin:0 auto;background:var(--bg);padding:calc(var(--sat) + 8px) 20px calc(var(--sab) + 28px);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:31;overflow-y:auto;-webkit-overflow-scrolling:touch}
.open #sheetbg{opacity:1;pointer-events:auto}.open #sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:#CFCFCA;margin:0 auto 12px}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 10px);transform:translate(-50%,-90px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-weight:600;font-size:14px;transition:.3s;z-index:50;max-width:90%}
#toast.show{transform:translate(-50%,0)}
.back{display:inline-flex;align-items:center;border:0;background:var(--acs);color:var(--ac);font-family:inherit;font-weight:600;padding:0 20px 0 14px;min-height:48px;border-radius:99px;margin:4px 0 10px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.ico{border:0;background:#fff;color:var(--ac);border-radius:50%;width:54px;height:54px;font-size:26px;line-height:1;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.acts a{display:block;text-align:center;background:var(--acs);color:var(--ac);text-decoration:none;font-weight:600;padding:14px 0;border-radius:14px}
.stat{display:flex;gap:10px}.stat .card{flex:1;padding:14px}.stat b{font-size:24px;letter-spacing:-.02em;display:block}
.empty{text-align:center;color:var(--mut);padding:30px 20px}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.stages{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.plan{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}.plan.pro{border-color:var(--ac)}
.plan ul{margin:8px 0 0;padding-left:18px;color:var(--mut);font-size:14px}.plan h3{margin:0;font-size:20px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px}@keyframes s{to{transform:rotate(360deg)}}
/* one font size for every button */
.btn,.pill,.seg button,.back,.tab,.acts a{font-size:16px}
.pill{min-height:44px}.seg button{min-height:42px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div id="main"></div></div>
<button id="fab" data-a="quick" aria-label="Quick actions">+</button>
<nav id="tabs"></nav>
<input type="file" id="rf" accept=".json,application/json" hidden>
<div id="toast"></div>
<div id="sheetbg" data-a="closeSheet"></div><div id="sheet"></div>
<script>
/* ===== helpers & storage ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(n,from)=>{const d=from?new Date(from+'T12:00'):new Date();d.setDate(d.getDate()+n);return dstr(d)};
const today=()=>dstr(new Date());
const uid=()=>Math.random().toString(36).slice(2,9);
const money=n=>'$'+Math.round(n||0).toLocaleString('en-CA');
const KEY='agentos.v1';let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=JSON.parse(JSON.stringify(S))}}
const CSTAGES=['New Lead','Active Buyer','Active Seller','Under Contract','Closed','Past Client'];
const DSTAGES=['Lead','Showing','Offer','Under Contract','Conditional','Firm','Closed'];
const LIMITS={clients:15,deals:2};

function seed(){
 const c=(name,phone,email,type,stage,budget,prefs,notes,next)=>({id:uid(),name,phone,email,type,stage,budget,prefs,notes,next,history:[]});
 const cl=[c('Sarah Mitchell','416-555-0142','sarah.m@example.com','Buyer','Active Buyer','$850K','3 bed, Mississauga/Oakville, near GO','Pre-approved. Wants a yard.',addD(0)),
 c('David & Priya Shah','905-555-0188','shahs@example.com','Buyer','Active Buyer','$1.1M','Detached, good schools','Relocating from Calgary.',addD(-2)),
 c('Marcus Lee','647-555-0119','marcus.lee@example.com','Buyer','Under Contract','$620K','Condo downtown','First-time buyer.',addD(3)),
 c('Elena Rossi','416-555-0177','elena.r@example.com','Seller','Active Seller','$1.35M','Listing in Etobicoke','Open house this weekend.',addD(1)),
 c('Tom Becker','289-555-0163','tom.b@example.com','Buyer','New Lead','$700K','Townhouse','Came from website form.',addD(-1)),
 c('Aisha Khan','647-555-0135','aisha.k@example.com','Seller','New Lead','','Thinking of selling in spring','Referral from Grace.',addD(0)),
 c('Grace Wong','416-555-0101','grace.w@example.com','Buyer','Closed','$900K','','Closed last month. Ask for referrals.',addD(14)),
 c('Robert Hall','905-555-0156','rob.h@example.com','Seller','Past Client','','','Sold 2023. Annual check-in.',addD(30))];
 const [sa,da,ma,el,to,ai,gr,ro]=cl;
 const dl=(client,address,value,pct,close,stage,notes,deadlines)=>({id:uid(),clientId:client.id,address,value,pct,close,stage,notes,deadlines:deadlines.map(([label,n])=>({id:uid(),label,date:addD(n)}))});
 const deals=[dl(sa,'48 Maple Grove Dr, Oakville',865000,2.5,addD(40),'Showing','Seen 3 homes. Likes this one.',[['Book second showing',1]]),
 dl(da,'12 Lakeshore Cres, Mississauga',1080000,2.5,addD(35),'Offer','Offer submitted at $1.07M.',[['Offer expires',0]]),
 dl(ma,'905-88 Harbour St #1204, Toronto',615000,2.5,addD(21),'Conditional','Financing + inspection conditions.',[['Financing condition',2],['Inspection report',4]]),
 dl(el,'231 Burnhamthorpe Rd, Etobicoke',1349000,2.25,addD(60),'Lead','Listing prep, photos booked.',[['Photographer',2]]),
 dl(gr,'7 Birchmount Ave, Toronto',905000,2.5,addD(-20),'Closed','Closed. Send gift.',[])];
 const t=(title,client,due,type,time,deal)=>({id:uid(),title,clientId:client?client.id:null,dealId:deal?deal.id:null,due,time:time||'',type,done:false,repeat:''});
 const tasks=[t('Follow up on new listing alert',sa,addD(0),'followup'),t('Check in after offer',da,addD(-2),'followup'),t('Call Tom: website lead',to,addD(-1),'followup'),
 t('Call Aisha about spring plans',ai,addD(0),'followup'),t('Showing: Maple Grove Dr',sa,addD(0),'appt','14:00',deals[0]),t('Listing appointment',el,addD(1),'appt','10:30',deals[3]),
 t('Send financing docs to lender',ma,addD(2),'task','',deals[2]),t('Order sign for Etobicoke listing',el,addD(1),'task','',deals[3]),t('Quarterly check-in',ro,addD(30),'followup'),t('Request referral from Grace',gr,addD(14),'followup')];
 const now=Date.now();
 const act=[{id:uid(),ts:now-3600e3,type:'call',text:'Called Marcus Lee: Connected'},{id:uid(),ts:now-7200e3,type:'deal',text:'Marcus Lee deal moved to Conditional'},{id:uid(),ts:now-86400e3*2,type:'client',text:'Added Tom Becker'}];
 [...cl,...deals,...tasks,...act].forEach(x=>x.sample=true);
 return {v:2,plan:'pro',clients:cl,deals,tasks,activity:act,name:'Alex'};
}
let S=load()||seed();
(function(){if(S.v>=2)return;const N=['Sarah Mitchell','David & Priya Shah','Marcus Lee','Elena Rossi','Tom Becker','Aisha Khan','Grace Wong','Robert Hall'];S.clients.forEach(c=>{if(N.includes(c.name))c.sample=true});const ci=new Set(S.clients.filter(c=>c.sample).map(c=>c.id));S.deals.forEach(d=>{if(ci.has(d.clientId))d.sample=true});const di=new Set(S.deals.filter(d=>d.sample).map(d=>d.id));S.tasks.forEach(t=>{if(ci.has(t.clientId)||di.has(t.dealId))t.sample=true});S.v=2})();
save();
let nav={tab:'today',stack:[],tf:'today',q:'',cf:'All',df:'Active',af:'week'};

/* ===== lookups & formatting ===== */
const cl=id=>S.clients.find(c=>c.id===id),deal=id=>S.deals.find(d=>d.id===id),task=id=>S.tasks.find(t=>t.id===id);
const ini=n=>n.split(/[ &]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const isPro=()=>true;
const comm=d=>d.value*d.pct/100;
const fmtDate=s=>new Date(s+'T12:00').toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'});
const fmtTime=t=>{if(!t)return'';const[h,m]=t.split(':');return(h%12||12)+':'+m+(h<12?' AM':' PM')};
function dueLabel(t){const d=today();let s;if(t.due===d)s='Today';else if(t.due===addD(1))s='Tomorrow';else if(t.due<d){const n=Math.round((new Date(d)-new Date(t.due))/864e5);s=n+'d overdue'}else s=fmtDate(t.due);return s+(t.time?' at '+fmtTime(t.time):'')}
function log(type,text){S.activity.unshift({id:uid(),ts:Date.now(),type,text});S.activity=S.activity.slice(0,400)}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2200)}
function sheet(h){const s=$('#sheet');s.innerHTML='<button class="back" data-a="closeSheet">&lsaquo; Back</button>'+h;s.scrollTop=0;document.body.classList.add('open')}
function closeSheet(){document.body.classList.remove('open')}
const val=id=>($('#'+id)?.value||'').trim();
const opts=(arr,sel)=>arr.map(a=>`<option ${a===sel?'selected':''}>${esc(a)}</option>`).join('');
const clientOpts=sel=>'<option value="">No client</option>'+S.clients.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');
const empty=(t,s)=>`<div class="empty"><b>${t}</b>${s}</div>`;

/* ===== views ===== */
const ICONS={today:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',clients:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',deals:'<path d="M3 11l9-8 9 8v10H3z"/><path d="M9 21v-6h6v6"/>',tasks:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
$('#tabs').innerHTML=Object.keys(ICONS).map(k=>`<button class="tab" data-a="tab" data-id="${k}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${k[0].toUpperCase()+k.slice(1)}</button>`).join('');

const taskRow=t=>{const c=cl(t.clientId),od=!t.done&&t.due<today();
 return `<div class="row"><button class="chk ${t.done?'on':''}" data-a="complete" data-id="${t.id}" aria-label="Complete task"></button><div class="grow" data-a="taskMenu" data-id="${t.id}"><b>${esc(t.title)}</b><small class="${od?'red':''}">${c?esc(c.name)+', ':''}${dueLabel(t)}</small></div><span class="tag ${t.type}">${{followup:'Follow-up',appt:'Appt',task:'Task'}[t.type]}</span></div>`};
const list=(arr,fn,e)=>arr.length?`<div class="card">${arr.map(fn).join('')}</div>`:e;
const open=()=>S.tasks.filter(t=>!t.done);
const byTime=(a,b)=>(a.due+a.time).localeCompare(b.due+b.time);

const V={
today(){
 const d=today(),h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
 const od=open().filter(t=>t.due<d).sort(byTime),td=open().filter(t=>t.due===d).sort((a,b)=>(a.type==='appt'?0:1)-(b.type==='appt'?0:1)||byTime(a,b));
 const dls=S.deals.filter(x=>x.stage!=='Closed').flatMap(x=>x.deadlines.map(l=>({...l,deal:x}))).filter(l=>l.date<=addD(7)).sort((a,b)=>a.date.localeCompare(b.date));
 return `<div class="top"><div><p class="sub" style="margin:0">${new Date().toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'})}</p><h1>${g}, ${esc(S.name)}</h1></div><button class="ico" data-a="push" data-id="activity" aria-label="History">&#9201;</button></div>
 <div class="stat" style="margin-top:12px"><div class="card"><b class="${od.length?'red':''}">${od.length}</b><small>Overdue</small></div><div class="card"><b>${td.length}</b><small>Due today</small></div><div class="card"><b>${dls.length}</b><small>Deal deadlines</small></div></div>
 ${S.clients.length&&(!S.lastBackup||Date.now()-S.lastBackup>12096e5)?`<div class="card pad" style="margin-top:12px"><b>Back up your data</b><p class="sub" style="margin:2px 0 10px">Your data lives on this phone only.</p><button class="btn sec" data-a="exportData">Download backup</button></div>`:''}
 ${od.length?`<h2>Overdue</h2>`+list(od,taskRow):''}
 <h2>Today</h2>${list(td,taskRow,`<div class="card">${empty('Nothing due today','Tap + to add a task or log a call.')}</div>`)}
 <h2>Deal deadlines, next 7 days</h2>${list(dls,l=>`<div class="row" data-a="push" data-id="deal:${l.deal.id}"><div class="grow"><b>${esc(l.label)}</b><small class="${l.date<d?'red':''}">${esc(cl(l.deal.clientId)?.name||'')}, ${l.date<d?'was ':''}${fmtDate(l.date)}</small></div><span class="tag">${l.deal.stage}</span></div>`,`<div class="card">${empty('No deadlines this week','Deadlines you add to deals appear here.')}</div>`)}`},

clients(){
 const q=nav.q.toLowerCase();
 const arr=S.clients.filter(c=>(nav.cf==='All'||c.stage===nav.cf)&&(!q||(c.name+c.email+c.phone).toLowerCase().includes(q))).sort((a,b)=>(a.next||'9').localeCompare(b.next||'9'));
 return `<div class="top"><h1>Clients</h1><button class="ico" data-a="newClient" aria-label="Add client">+</button></div>
 <p class="sub">${S.clients.length} total${isPro()?'':' of '+LIMITS.clients+' on Free'}</p>
 <input id="q" type="search" placeholder="Search clients" value="${esc(nav.q)}" data-a="noop">
 <div class="pills">${['All',...CSTAGES].map(s=>`<button class="pill ${nav.cf===s?'on':''}" data-a="cf" data-id="${s}">${s}</button>`).join('')}</div>
 <div id="clist">${list(arr,c=>`<div class="row" data-a="push" data-id="client:${c.id}"><div class="av">${ini(c.name)}</div><div class="grow"><b>${esc(c.name)}</b><small class="${c.next&&c.next<today()?'red':''}">${c.stage}${c.next?', next '+fmtDate(c.next):''}</small></div></div>`,`<div class="card">${empty('No clients found','Try another filter or add a new client.')}</div>`)}</div>`},

client(id){const c=cl(id);if(!c)return back();
 const tk=S.tasks.filter(t=>t.clientId===id&&!t.done).sort(byTime),ds=S.deals.filter(d=>d.clientId===id);
 return `<button class="back" data-a="pop">&lsaquo; Clients</button>
 <div class="top"><div><h1 style="font-size:30px">${esc(c.name)}</h1><span class="tag">${c.stage}</span></div><button class="ico" data-a="editClient" data-id="${id}" aria-label="Edit">&#9998;</button></div>
 <div class="acts"><a href="tel:${esc(c.phone)}">Call</a><a href="sms:${esc(c.phone)}">Message</a><a href="mailto:${esc(c.email)}">Email</a></div>
 <button class="btn" data-a="openLog" data-id="${id}">Log a call</button>
 <h2>Details</h2><div class="card pad">${[['Type',c.type],['Budget',c.budget],['Preferences',c.prefs],['Phone',c.phone],['Email',c.email],['Next follow-up',c.next?fmtDate(c.next):'Not scheduled'],['Notes',c.notes]].map(([k,v])=>`<small>${k}</small><div style="margin-bottom:10px">${esc(v)||'<span style="color:#aaa">None</span>'}</div>`).join('')}</div>
 <h2>Open tasks</h2>${list(tk,taskRow,`<div class="card">${empty('No open tasks','Schedule a follow-up so this client is not forgotten.')}</div>`)}
 <h2>Deals</h2>${list(ds,d=>dealRow(d),`<div class="card">${empty('No deals yet','')}</div>`)}
 <h2>Communication history</h2>${list(c.history,h=>`<div class="row"><div class="grow"><b>${esc(h.outcome)}</b><small>${new Date(h.ts).toLocaleDateString('en-CA',{month:'short',day:'numeric'})}${h.note?', '+esc(h.note):''}</small></div></div>`,`<div class="card">${empty('No history yet','Log a call to start the record.')}</div>`)}

/* ===== render & navigation ===== */
function render(){const top=nav.stack[nav.stack.length-1];

 save();closeSheet();render()},

 <div style="height:16px"></div><button class="btn" data-a="saveTask" data-id="${dealId||''}">Add task</button>`)}

/* ===== events ===== */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='INPUT')return;const f=A[t.dataset.a];if(!f)return;
 try{ if(t.dataset.a==='openLog')openLog(t.dataset.id||''); else f(t.dataset.id,t,e)}catch(err){console.error(err);toast('Something went wrong')}});
document.addEventListener('input',e=>{if(e.target.id==='q'){nav.q=e.target.value;const arr=S.clients.filter(c=>(nav.cf==='All'||c.stage===nav.cf)&&(c.name+c.email+c.phone).toLowerCase().includes(nav.q.toLowerCase()));
 $('#clist').innerHTML=list(arr,c=>`<div class="row" data-a="push" data-id="client:${c.id}"><div class="av">${ini(c.name)}</div><div class="grow"><b>${esc(c.name)}</b><small>${c.stage}</small></div></div>`,`<div class="card">${empty('No clients found','Try another search.')}</div>`)}});
document.addEventListener('gesturestart',e=>e.preventDefault());
let PENDING=null;
$('#rf').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 const r=new FileReader();r.onerror=()=>toast('Could not read that file');
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.clients)||!Array.isArray(o.deals)||!Array.isArray(o.tasks))throw 0;PENDING=o;
  sheet(`<h1 style="font-size:22px;margin:0">Restore this backup?</h1><p class="sub">It contains ${o.clients.length} clients, ${o.deals.length} deals and ${o.tasks.length} tasks. Your current data will be replaced.</p><button class="btn" data-a="doRestore">Restore backup</button><div style="height:10px"></div><button class="btn sec" data-a="closeSheet">Cancel</button>`)}catch(x){toast('That is not a valid AgentOS backup')}};
 r.readAsText(f)});

/* ===== PWA: inline manifest + generated icon ===== */
try{const m={name:'AgentOS',short_name:'AgentOS',start_url:'.',display:'standalone',background_color:'#F5F5F2',theme_color:'#F5F5F2'};
 const cv=document.createElement('canvas');cv.width=cv.height=180;const x=cv.getContext('2d');x.fillStyle='#0B7A75';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.beginPath();x.moveTo(40,98);x.lineTo(90,52);x.lineTo(140,98);x.lineTo(126,98);x.lineTo(126,134);x.lineTo(54,134);x.lineTo(54,98);x.fill();
 const u=cv.toDataURL('image/png');m.icons=[{src:u,sizes:'180x180',type:'image/png'}];$('#ic').href=u;
 $('#mf').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
render();
</script>
</body>
</html>
